version: v0.4
project:
  name: Face numbers of cubical polytopes
  description: Convex cubical polytopes satisfy the edge and higher-face lower bounds of Theorem 1.1 and
    Corollary 3.1, with equality for stacked cubical polytopes. In dimensions at least four the strengthened
    edge bound holds for finite connected closed cubical homology manifolds over any field with bipartite
    graph and common-face intersections. The mod-two homology-sphere result also supplies a bipartition.
  authors:
  - Caius Folkerts
  responsible_maintainers:
  - Caius Folkerts
  license: Apache-2.0
