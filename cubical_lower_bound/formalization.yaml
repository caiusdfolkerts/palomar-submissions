limitations:
- Homology is expressed in the finite combinatorial model. The normal link of a cell is represented by
  the order complex of its strict cofaces. Sphere cohomology is specified by the ordinary simplicial coboundary
  over the given field. The connectedness hypothesis is on the comparability graph of nonempty cells,
  the one-skeleton of the barycentric subdivision.
- The polytope results include higher face numbers and stacked equality. The homology-manifold and mod-two
  homology-sphere extensions concern the strengthened edge bound (3.1).
